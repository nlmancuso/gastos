name: Enviar Vencimientos

on:
  schedule:
    - cron: '0 10 * * *' # Este era el horario viejo de GitHub
  workflow_dispatch: # Permite activarlo manualmente o mediante webhooks externos

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script de notificaciones
        run: node notificador.js
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
