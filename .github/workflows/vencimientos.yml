name: Enviar Alertas de Vencimiento

on:
  workflow_dispatch:
    inputs:
      enviar_correo:
        description: "Enviar el correo después de las pruebas"
        required: true
        default: false
        type: boolean

jobs:
  enviar-alerta:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --no-save resend firebase-admin

      - name: Probar cálculos del notificador
        run: node --test tests/notificador-calculos.test.mjs

      - name: Ejecutar script de notificaciones
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.MY_EMAIL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_GROUP_ID: ${{ vars.FIRESTORE_GROUP_ID }}
          ENVIAR_CORREO: ${{ inputs.enviar_correo }}
        run: node notificador.js
