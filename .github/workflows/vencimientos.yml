name: Enviar Alertas de Vencimiento

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 UTC (puedes ajustarlo después)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras probarlo

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install resend firebase-admin

      - name: Ejecutar script de notificaciones
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
        run: node notificador.js
