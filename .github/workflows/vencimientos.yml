name: Enviar Alertas de Vencimiento

on:
  workflow_dispatch:
    inputs:
      enviar_correo:
        description: "Enviar correos individuales a los miembros mediante EmailJS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  enviar-alerta:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Probar cálculos del notificador
        run: node --test tests/notificador-calculos.test.mjs

      - name: Ejecutar script de notificaciones
        env:
          EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}
          EMAILJS_ALERTS_TEMPLATE_ID: template_hezrjyv
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          ENVIAR_CORREO: ${{ inputs.enviar_correo }}
        run: node notificador.js
