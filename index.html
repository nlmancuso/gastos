<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Personales v2.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de tu proyecto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDwRTcVpwoHJfTZ-eUr5ileTks5LN-npOE",
            authDomain: "gastos-334ff.firebaseapp.com",
            projectId: "gastos-334ff",
            storageBucket: "gastos-334ff.firebasestorage.app",
            messagingSenderId: "140017165186",
            appId: "1:140017165186:web:2b6d7d57896696bef3a59b"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "app_data", "usuario_principal");

        window.db = db;
        window.docRef = docRef;
        window.setDoc = setDoc;

        // Escuchar cambios en tiempo real desde la nube
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                window.appState = data.appState || window.appState;
            } else {
                // Si la base está vacía, guardar estado inicial
                saveDataToCloud();
            }
            document.getElementById('cloudStatus').innerText = "☁️ Conectado a la Nube";
            document.getElementById('cloudStatus').className = "text-xs bg-green-100 text-green-800 font-semibold px-2.5 py-0.5 rounded border border-green-300";
            renderApp();
        }, (error) => {
            console.error("Error al conectar con la nube: ", error);
            document.getElementById('cloudStatus').innerText = "⚠️ Modo Local (Sin Conexión)";
            document.getElementById('cloudStatus').className = "text-xs bg-yellow-100 text-yellow-800 font-semibold px-2.5 py-0.5 rounded border border-yellow-300";
            renderApp();
        });

        // Función global para guardar en Firebase
        window.saveDataToCloud = async function() {
            try {
                await setDoc(docRef, { appState: window.appState });
                localStorage.setItem('gastos_app_state_backup', JSON.stringify(window.appState));
            } catch (e) {
                console.error("Error guardando datos en Firestore:", e);
            }
        };
    </script>

    <style>
        .active-tab {
            border-bottom: 3px solid #3B82F6;
            color: #3B82F6;
            font-weight: 600;
        }
        .sort-icon {
            font-size: 0.75rem;
            margin-left: 0.25rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Navbar Header -->
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center flex-wrap gap-2">
            <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-wallet text-blue-600"></i> Control de Gastos Personales
            </h1>
            <div class="flex items-center gap-3">
                <span id="cloudStatus" class="text-xs bg-gray-100 text-gray-600 font-semibold px-2.5 py-0.5 rounded border border-gray-300">
                    🔄 Conectando...
                </span>
                <button onclick="exportData()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 py-1.5 px-3 rounded shadow transition">
                    <i class="fa-solid fa-download"></i> Respaldar
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Selector de Mes y Acciones -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <label for="monthSelector" class="font-semibold text-gray-700">Período Actual:</label>
                <input type="month" id="monthSelector" class="border rounded px-3 py-1.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="changeMonth(this.value)">
            </div>
            
            <div class="flex gap-2 flex-wrap">
                <button onclick="openModal('modalSueldo')" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Ingreso / Sueldo
                </button>
                <button onclick="openModal('modalGasto')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-plus"></i> Registrar Gasto
                </button>
            </div>
        </div>

        <!-- Tarjetas de Resumen Financiero -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-sm text-gray-500 font-medium">Ingresos Totales</p>
                <h2 id="totalIngresos" class="text-2xl font-bold text-gray-800">$0,00</h2>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-red-500">
                <p class="text-sm text-gray-500 font-medium">Gastos del Mes</p>
                <h2 id="totalGastos" class="text-2xl font-bold text-gray-800">$0,00</h2>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-purple-500">
                <p class="text-sm text-gray-500 font-medium">Compromisos Cuotas Futuras</p>
                <h2 id="totalCompromisos" class="text-2xl font-bold text-gray-800">$0,00</h2>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                <p class="text-sm text-gray-500 font-medium">Saldo Restante</p>
                <h2 id="saldoRestante" class="text-2xl font-bold text-gray-800">$0,00</h2>
            </div>
        </div>

        <!-- Tabla Principal de Movimientos -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">Detalle de Gastos e Ingresos</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('fecha')">
                                Fecha <i id="sortIcon_fecha" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('concepto')">
                                Concepto <i id="sortIcon_concepto" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('categoria')">
                                Categoría <i id="sortIcon_categoria" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('monto')">
                                Monto <i id="sortIcon_monto" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Cuotas / Info
                            </th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="bg-white divide-y divide-gray-200">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Agregar/Editar Gasto -->
    <div id="modalGasto" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <h3 id="modalGastoTitulo" class="text-lg font-bold text-gray-900 mb-4">Registrar Nuevo Gasto</h3>
            <form id="formGasto" onsubmit="handleSaveGasto(event)">
                <input type="hidden" id="gastoId">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700">Concepto / Descripción</label>
                    <input type="text" id="gastoConcepto" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Monto ($)</label>
                        <input type="number" step="0.01" id="gastoMonto" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fecha</label>
                        <input type="date" id="gastoFecha" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Categoría</label>
                        <select id="gastoCategoria" class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                            <option value="Supermercado">Supermercado</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Entretenimiento">Entretenimiento</option>
                            <option value="Salud">Salud</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Cuotas Totales</label>
                        <input type="number" id="gastoCuotas" value="1" min="1" max="60" class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeModal('modalGasto')" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">Guardar Gasto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Agregar Ingreso/Sueldo -->
    <div id="modalSueldo" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Registrar Ingreso / Sueldo</h3>
            <form id="formSueldo" onsubmit="handleSaveSueldo(event)">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700">Concepto</label>
                    <input type="text" id="sueldoConcepto" value="Sueldo / Ingreso" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-green-500">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Monto ($)</label>
                        <input type="number" step="0.01" id="sueldoMonto" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fecha</label>
                        <input type="date" id="sueldoFecha" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-green-500">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeModal('modalSueldo')" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm font-medium">Guardar Ingreso</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script principal de lógica Javascript -->
    <script>
        // Estado global de la app
        window.appState = window.appState || {
            currentMonth: new Date().toISOString().slice(0, 7),
            gastos: [],
            ingresos: [],
            sortColumn: 'fecha',
            sortAscending: false
        };

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('gastoFecha').value = today;
            document.getElementById('sueldoFecha').value = today;
            document.getElementById('monthSelector').value = window.appState.currentMonth;
        });

        function changeMonth(monthValue) {
            window.appState.currentMonth = monthValue;
            renderApp();
        }

        function sortData(column) {
            if (window.appState.sortColumn === column) {
                window.appState.sortAscending = !window.appState.sortAscending;
            } else {
                window.appState.sortColumn = column;
                window.appState.sortAscending = true;
            }
            renderApp();
        }

        function renderApp() {
            const currentMonth = window.appState.currentMonth || new Date().toISOString().slice(0, 7);
            document.getElementById('monthSelector').value = currentMonth;

            // Filtrar y procesar movimientos del mes
            let items = [];

            // Procesar ingresos
            (window.appState.ingresos || []).forEach(ing => {
                if (ing.fecha.startsWith(currentMonth)) {
                    items.push({
                        id: ing.id,
                        tipo: 'ingreso',
                        concepto: ing.concepto,
                        categoria: 'Ingreso',
                        monto: parseFloat(ing.monto),
                        fecha: ing.fecha,
                        cuotaInfo: 'Único'
                    });
                }
            });

            // Procesar gastos (incluyendo cuotas)
            let totalCompromisosFuturos = 0;
            (window.appState.gastos || []).forEach(gasto => {
                const totalCuotas = parseInt(gasto.cuotas) || 1;
                const montoCuota = parseFloat(gasto.monto) / totalCuotas;
                const fechaInicio = new Date(gasto.fecha + "T00:00:00");

                for (let i = 0; i < totalCuotas; i++) {
                    let f = new Date(fechaInicio);
                    f.setMonth(f.getMonth() + i);
                    let mStr = f.toISOString().slice(0, 7);

                    if (mStr === currentMonth) {
                        items.push({
                            id: gasto.id,
                            tipo: 'gasto',
                            concepto: gasto.concepto,
                            categoria: gasto.categoria,
                            monto: montoCuota,
                            fecha: gasto.fecha,
                            cuotaInfo: totalCuotas > 1 ? `Cuota ${i + 1}/${totalCuotas}` : 'Contado',
                            original: gasto
                        });
                    }

                    if (mStr > currentMonth) {
                        totalCompromisosFuturos += montoCuota;
                    }
                }
            });

            // Ordenamiento
            const col = window.appState.sortColumn;
            const asc = window.appState.sortAscending;
            items.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];

                if (typeof valA === 'string') {
                    return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return asc ? valA - valB : valB - valA;
                }
            });

            // Cálculos Totales
            let totalIng = items.filter(i => i.tipo === 'ingreso').reduce((acc, i) => acc + i.monto, 0);
            let totalGas = items.filter(i => i.tipo === 'gasto').reduce((acc, i) => acc + i.monto, 0);
            let saldo = totalIng - totalGas;

            document.getElementById('totalIngresos').innerText = `$${totalIng.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            document.getElementById('totalGastos').innerText = `$${totalGas.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            document.getElementById('totalCompromisos').innerText = `$${totalCompromisosFuturos.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            document.getElementById('saldoRestante').innerText = `$${saldo.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;

            // Renderizar Tabla
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No hay movimientos en este mes.</td></tr>`;
                return;
            }

            items.forEach(item => {
                const tr = document.createElement('tr');
                const isIngreso = item.tipo === 'ingreso';

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${item.fecha}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${isIngreso ? 'text-green-700' : 'text-gray-900'}">${item.concepto}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${isIngreso ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                            ${item.categoria}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold ${isIngreso ? 'text-green-600' : 'text-red-600'}">
                        ${isIngreso ? '+' : '-'}$${item.monto.toLocaleString('es-AR', {minimumFractionDigits: 2})}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.cuotaInfo}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        ${!isIngreso ? `
                            <button onclick="editGasto('${item.id}')" class="text-blue-600 hover:text-blue-900 mr-3"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteGasto('${item.id}')" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                        ` : `
                            <button onclick="deleteIngreso('${item.id}')" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                        `}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Acciones CRUD
        function handleSaveGasto(e) {
            e.preventDefault();
            const id = document.getElementById('gastoId').value;
            const concepto = document.getElementById('gastoConcepto').value;
            const monto = parseFloat(document.getElementById('gastoMonto').value);
            const fecha = document.getElementById('gastoFecha').value;
            const categoria = document.getElementById('gastoCategoria').value;
            const cuotas = parseInt(document.getElementById('gastoCuotas').value) || 1;

            if (id) {
                // Editar
                const idx = window.appState.gastos.findIndex(g => g.id === id);
                if (idx !== -1) {
                    window.appState.gastos[idx] = { id, concepto, monto, fecha, categoria, cuotas };
                }
            } else {
                // Agregar
                const newGasto = { id: Date.now().toString(), concepto, monto, fecha, categoria, cuotas };
                window.appState.gastos.push(newGasto);
            }

            window.saveDataToCloud();
            closeModal('modalGasto');
        }

        function handleSaveSueldo(e) {
            e.preventDefault();
            const concepto = document.getElementById('sueldoConcepto').value;
            const monto = parseFloat(document.getElementById('sueldoMonto').value);
            const fecha = document.getElementById('sueldoFecha').value;

            const newIngreso = { id: Date.now().toString(), concepto, monto, fecha };
            window.appState.ingresos.push(newIngreso);

            window.saveDataToCloud();
            closeModal('modalSueldo');
        }

        function editGasto(id) {
            const gasto = window.appState.gastos.find(g => g.id === id);
            if (!gasto) return;

            document.getElementById('gastoId').value = gasto.id;
            document.getElementById('gastoConcepto').value = gasto.concepto;
            document.getElementById('gastoMonto').value = gasto.monto;
            document.getElementById('gastoFecha').value = gasto.fecha;
            document.getElementById('gastoCategoria').value = gasto.categoria;
            document.getElementById('gastoCuotas').value = gasto.cuotas || 1;

            document.getElementById('modalGastoTitulo').innerText = "Editar Gasto";
            openModal('modalGasto');
        }

        function deleteGasto(id) {
            if (confirm('¿Estás seguro de que querés eliminar este gasto?')) {
                window.appState.gastos = window.appState.gastos.filter(g => g.id !== id);
                window.saveDataToCloud();
            }
        }

        function deleteIngreso(id) {
            if (confirm('¿Estás seguro de que querés eliminar este ingreso?')) {
                window.appState.ingresos = window.appState.ingresos.filter(i => i.id !== id);
                window.saveDataToCloud();
            }
        }

        // Modales
        function openModal(id) {
            if (id === 'modalGasto' && !document.getElementById('gastoId').value) {
                document.getElementById('modalGastoTitulo').innerText = "Registrar Nuevo Gasto";
                document.getElementById('formGasto').reset();
                document.getElementById('gastoFecha').value = new Date().toISOString().slice(0, 10);
            }
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            if (id === 'modalGasto') {
                document.getElementById('gastoId').value = '';
                document.getElementById('formGasto').reset();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.appState));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `respaldo_gastos_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
