<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Personales</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwRTcVpwoHJfTZ-eUr5ileTks5LN-npOE",
            authDomain: "gastos-334ff.firebaseapp.com",
            projectId: "gastos-334ff",
            storageBucket: "gastos-334ff.firebasestorage.app",
            messagingSenderId: "140017165186",
            appId: "1:140017165186:web:2b6d7d57896696bef3a59b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "app_data", "usuario_principal");

        window.db = db;
        window.docRef = docRef;

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                window.appState = data.appState || window.appState;
            } else {
                saveDataToCloud();
            }
            document.getElementById('cloudStatus').innerText = "☁️ Conectado a la Nube";
            document.getElementById('cloudStatus').className = "text-xs bg-green-900 text-green-200 font-semibold px-2.5 py-0.5 rounded border border-green-700";
            renderApp();
        }, (error) => {
            console.error("Error en nube: ", error);
            document.getElementById('cloudStatus').innerText = "⚠️ Modo Local";
            document.getElementById('cloudStatus').className = "text-xs bg-yellow-900 text-yellow-200 font-semibold px-2.5 py-0.5 rounded border border-yellow-700";
            renderApp();
        });

        window.saveDataToCloud = async function() {
            try {
                await setDoc(docRef, { appState: window.appState });
                localStorage.setItem('gastos_app_state_backup', JSON.stringify(window.appState));
            } catch (e) {
                console.error("Error guardando datos:", e);
            }
        };
    </script>

    <style>
        .sort-icon { font-size: 0.75rem; margin-left: 0.25rem; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-gray-100">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-wallet text-blue-500"></i> Control de Gastos Personales
            </h1>
            <div class="flex items-center gap-3">
                <span id="cloudStatus" class="text-xs bg-slate-700 text-slate-300 font-semibold px-2.5 py-0.5 rounded border border-slate-600">
                    🔄 Conectando...
                </span>
                <button onclick="exportData()" class="text-sm bg-slate-700 hover:bg-slate-600 text-slate-200 py-1.5 px-3 rounded shadow transition border border-slate-600">
                    <i class="fa-solid fa-download"></i> Respaldar
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Selector de Mes y Botón de Gastos -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg shadow mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <label for="monthSelector" class="font-semibold text-slate-300">Período Actual:</label>
                <input type="month" id="monthSelector" class="bg-slate-900 border border-slate-600 text-white rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="changeMonth(this.value)">
            </div>
            
            <button onclick="openModalGasto()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded shadow transition flex items-center gap-2">
                <i class="fa-solid fa-cart-plus"></i> Registrar Gasto
            </button>
        </div>

        <!-- Tarjetas de Resumen Financiero con Lápiz para editar Sueldo -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-slate-800 border-l-4 border-green-500 border-t border-r border-b border-slate-700 p-4 rounded-lg shadow relative">
                <div class="flex justify-between items-center">
                    <p class="text-sm text-slate-400 font-medium">Ingresos / Sueldo</p>
                    <button onclick="openModalSueldo()" class="text-slate-400 hover:text-green-400 transition" title="Editar Sueldo">
                        <i class="fa-solid fa-pen text-sm"></i>
                    </button>
                </div>
                <h2 id="totalIngresos" class="text-2xl font-bold text-white mt-1">$0,00</h2>
            </div>

            <div class="bg-slate-800 border-l-4 border-red-500 border-t border-r border-b border-slate-700 p-4 rounded-lg shadow">
                <p class="text-sm text-slate-400 font-medium">Gastos del Mes</p>
                <h2 id="totalGastos" class="text-2xl font-bold text-white mt-1">$0,00</h2>
            </div>

            <div class="bg-slate-800 border-l-4 border-purple-500 border-t border-r border-b border-slate-700 p-4 rounded-lg shadow">
                <p class="text-sm text-slate-400 font-medium">Compromisos Cuotas Futuras</p>
                <h2 id="totalCompromisos" class="text-2xl font-bold text-white mt-1">$0,00</h2>
            </div>

            <div class="bg-slate-800 border-l-4 border-blue-500 border-t border-r border-b border-slate-700 p-4 rounded-lg shadow">
                <p class="text-sm text-slate-400 font-medium">Saldo Restante</p>
                <h2 id="saldoRestante" class="text-2xl font-bold text-white mt-1">$0,00</h2>
            </div>
        </div>

        <!-- Tabla Principal de Movimientos -->
        <div class="bg-slate-800 border border-slate-700 rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700">
                <h3 class="text-lg font-bold text-white">Detalle de Gastos e Ingresos</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-700">
                    <thead class="bg-slate-900/50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('fecha')">
                                Fecha <i id="sortIcon_fecha" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('concepto')">
                                Concepto <i id="sortIcon_concepto" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('categoria')">
                                Categoría <i id="sortIcon_categoria" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider cursor-pointer select-none" onclick="sortData('monto')">
                                Monto <i id="sortIcon_monto" class="fa-solid fa-sort sort-icon"></i>
                            </th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
                                Cuotas / Info
                            </th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-slate-400 uppercase tracking-wider">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="divide-y divide-slate-700">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Editar Sueldo -->
    <div id="modalSueldo" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-w-md w-full p-6 text-white">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-pen text-green-400"></i> Modificar Sueldo del Mes</h3>
            <form id="formSueldo" onsubmit="handleSaveSueldo(event)">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-slate-300">Monto del Sueldo / Ingreso ($)</label>
                    <input type="number" step="0.01" id="sueldoMonto" required class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:ring-2 focus:ring-green-500">
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeModal('modalSueldo')" class="px-4 py-2 bg-slate-700 text-slate-200 rounded hover:bg-slate-600 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-500 text-sm font-medium">Guardar Sueldo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Registrar/Editar Gasto -->
    <div id="modalGasto" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-w-md w-full p-6 text-white">
            <h3 id="modalGastoTitulo" class="text-lg font-bold mb-4">Registrar Nuevo Gasto</h3>
            <form id="formGasto" onsubmit="handleSaveGasto(event)">
                <input type="hidden" id="gastoId">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-slate-300">Concepto / Descripción</label>
                    <input type="text" id="gastoConcepto" required class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Monto ($)</label>
                        <input type="number" step="0.01" id="gastoMonto" required class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Fecha</label>
                        <input type="date" id="gastoFecha" required class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Categoría</label>
                        <select id="gastoCategoria" class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500">
                            <option value="Supermercado">Supermercado</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Entretenimiento">Entretenimiento</option>
                            <option value="Salud">Salud</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Cuotas Totales</label>
                        <input type="number" id="gastoCuotas" value="1" min="1" max="60" class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeModal('modalGasto')" class="px-4 py-2 bg-slate-700 text-slate-200 rounded hover:bg-slate-600 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-500 text-sm font-medium">Guardar Gasto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        window.appState = window.appState || {
            currentMonth: new Date().toISOString().slice(0, 7),
            gastos: [],
            sueldos: {},
            sortColumn: 'fecha',
            sortAscending: false
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('gastoFecha').value = new Date().toISOString().slice(0, 10);
            document.getElementById('monthSelector').value = window.appState.currentMonth;
        });

        function changeMonth(monthValue) {
            window.appState.currentMonth = monthValue;
            renderApp();
        }

        function sortData(column) {
            if (window.appState.sortColumn === column) {
                window.appState.sortAscending = !window.appState.sortAscending;
            } else {
                window.appState.sortColumn = column;
                window.appState.sortAscending = true;
            }
            renderApp();
        }

        function renderApp() {
            const currentMonth = window.appState.currentMonth || new Date().toISOString().slice(0, 7);
            document.getElementById('monthSelector').value = currentMonth;

            const sueldoActual = parseFloat((window.appState.sueldos || {})[currentMonth]) || 0;

            let items = [];

            if (sueldoActual > 0) {
                items.push({
                    id: 'sueldo_' + currentMonth,
                    tipo: 'ingreso',
                    concepto: 'Sueldo / Ingreso Mensual',
                    categoria: 'Ingreso',
                    monto: sueldoActual,
                    fecha: `${currentMonth}-01`,
                    cuotaInfo: 'Mensual'
                });
            }

            let totalCompromisosFuturos = 0;
            (window.appState.gastos || []).forEach(gasto => {
                const totalCuotas = parseInt(gasto.cuotas) || 1;
                const montoCuota = parseFloat(gasto.monto) / totalCuotas;
                const fechaInicio = new Date(gasto.fecha + "T00:00:00");

                for (let i = 0; i < totalCuotas; i++) {
                    let f = new Date(fechaInicio);
                    f.setMonth(f.getMonth() + i);
                    let mStr = f.toISOString().slice(0, 7);

                    if (mStr === currentMonth) {
                        items.push({
                            id: gasto.id,
                            tipo: 'gasto',
                            concepto: gasto.concepto,
                            categoria: gasto.categoria,
                            monto: montoCuota,
                            fecha: gasto.fecha,
                            cuotaInfo: totalCuotas > 1 ? `Cuota ${i + 1}/${totalCuotas}` : 'Contado'
                        });
                    }

                    if (mStr > currentMonth) {
                        totalCompromisosFuturos += montoCuota;
                    }
                }
            });

            const col = window.appState.sortColumn;
            const asc = window.appState.sortAscending;
            items.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];
                if (typeof valA === 'string') {
                    return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return asc ? valA - valB : valB - valA;
                }
            });

            let totalGas = items.filter(i => i.tipo === 'gasto').reduce((acc, i) => acc + i.monto, 0);
            let saldo = sueldoActual - totalGas;

            document.getElementById('totalIngresos').innerText = `$${sueldoActual.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            document.getElementById('totalGastos').innerText = `$${totalGas.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            document.getElementById('totalCompromisos').innerText = `$${totalCompromisosFuturos.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            document.getElementById('saldoRestante').innerText = `$${saldo.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;

            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-slate-400">No hay movimientos en este mes.</td></tr>`;
                return;
            }

            items.forEach(item => {
                const tr = document.createElement('tr');
                const isIngreso = item.tipo === 'ingreso';

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-300">${item.fecha}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${isIngreso ? 'text-green-400' : 'text-slate-100'}">${item.concepto}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-300">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isIngreso ? 'bg-green-950 text-green-300 border border-green-800' : 'bg-slate-700 text-slate-300 border border-slate-600'}">
                            ${item.categoria}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold ${isIngreso ? 'text-green-400' : 'text-red-400'}">
                        ${isIngreso ? '+' : '-'}$${item.monto.toLocaleString('es-AR', {minimumFractionDigits: 2})}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-400">${item.cuotaInfo}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        ${isIngreso ? `
                            <button onclick="openModalSueldo()" class="text-blue-400 hover:text-blue-300 mr-2" title="Editar Sueldo"><i class="fa-solid fa-pen"></i></button>
                        ` : `
                            <button onclick="editGasto('${item.id}')" class="text-blue-400 hover:text-blue-300 mr-3"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteGasto('${item.id}')" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
                        `}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleSaveSueldo(e) {
            e.preventDefault();
            const monto = parseFloat(document.getElementById('sueldoMonto').value);
            const currentMonth = window.appState.currentMonth;

            if (!window.appState.sueldos) window.appState.sueldos = {};
            window.appState.sueldos[currentMonth] = monto;

            window.saveDataToCloud();
            closeModal('modalSueldo');
        }

        function handleSaveGasto(e) {
            e.preventDefault();
            const id = document.getElementById('gastoId').value;
            const concepto = document.getElementById('gastoConcepto').value;
            const monto = parseFloat(document.getElementById('gastoMonto').value);
            const fecha = document.getElementById('gastoFecha').value;
            const categoria = document.getElementById('gastoCategoria').value;
            const cuotas = parseInt(document.getElementById('gastoCuotas').value) || 1;

            if (id) {
                const idx = window.appState.gastos.findIndex(g => g.id === id);
                if (idx !== -1) window.appState.gastos[idx] = { id, concepto, monto, fecha, categoria, cuotas };
            } else {
                window.appState.gastos.push({ id: Date.now().toString(), concepto, monto, fecha, categoria, cuotas });
            }

            window.saveDataToCloud();
            closeModal('modalGasto');
        }

        function editGasto(id) {
            const gasto = window.appState.gastos.find(g => g.id === id);
            if (!gasto) return;

            document.getElementById('gastoId').value = gasto.id;
            document.getElementById('gastoConcepto').value = gasto.concepto;
            document.getElementById('gastoMonto').value = gasto.monto;
            document.getElementById('gastoFecha').value = gasto.fecha;
            document.getElementById('gastoCategoria').value = gasto.categoria;
            document.getElementById('gastoCuotas').value = gasto.cuotas || 1;

            document.getElementById('modalGastoTitulo').innerText = "Editar Gasto";
            openModalGasto();
        }

        function deleteGasto(id) {
            if (confirm('¿Estás seguro de que querés eliminar este gasto?')) {
                window.appState.gastos = window.appState.gastos.filter(g => g.id !== id);
                window.saveDataToCloud();
            }
        }

        function openModalSueldo() {
            const currentMonth = window.appState.currentMonth;
            const sueldoActual = (window.appState.sueldos || {})[currentMonth] || '';
            document.getElementById('sueldoMonto').value = sueldoActual;
            document.getElementById('modalSueldo').classList.remove('hidden');
        }

        function openModalGasto() {
            if (!document.getElementById('gastoId').value) {
                document.getElementById('modalGastoTitulo').innerText = "Registrar Nuevo Gasto";
                document.getElementById('formGasto').reset();
                document.getElementById('gastoFecha').value = new Date().toISOString().slice(0, 10);
            }
            document.getElementById('modalGasto').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            if (id === 'modalGasto') {
                document.getElementById('gastoId').value = '';
                document.getElementById('formGasto').reset();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.appState));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `respaldo_gastos_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
